name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Fetch the submodules the build uses
      run: |
        git -c url."https://github.com/".insteadOf=git@github.com: \
          submodule update --init --depth 1 vendor/samba vendor/termlib

    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.97.1
        targets: aarch64-linux-android
        components: rustfmt, clippy

    - name: Install NDK r27c
      run: |
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
        echo "PR_NDK=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

    - name: Configure Cargo for NDK
      run: |
        sed -i "s|/home/o/Android/Sdk/ndk/[^/]*|$PR_NDK|g" src/pr-cli/.cargo/config.toml
        sed -i "s|/home/o/Android/Sdk/ndk/[^/]*|$PR_NDK|g" src/proot-integration-test/.cargo/config.toml

    - name: Run Cargo Format (pr-cli)
      run: |
        cd src/pr-cli
        cargo fmt -- --check

    - name: Run Cargo Format (proot-integration-test)
      run: |
        cd src/proot-integration-test
        cargo fmt -- --check

    # pr-cli embeds this binary (include_bytes! in cmd_test.rs), so it must exist before cargo test.
    - name: Build Integration Test Binary
      run: |
        cd src/proot-integration-test
        cargo build --target aarch64-linux-android --release

    - name: Run Cargo Clippy (proot-integration-test)
      run: |
        cd src/proot-integration-test
        cargo clippy --target aarch64-linux-android --release -- -D warnings

    - name: Run Cargo Clippy (pr-cli)
      run: |
        cd src/pr-cli
        cargo clippy --all-targets -- -D warnings

    - name: Run Cargo Test (pr-cli)
      run: |
        cd src/pr-cli
        cargo test

    - name: Build Proot C Binaries
      run: |
        ./scripts/build.sh --arch=arm64 --ndk-path=$PR_NDK

    - name: Build Rust CLI (pr-cli) into proot-engine
      run: ./scripts/build-pr-cli.sh

    - name: Copy proot binaries to proot-engine
      run: |
        cp build/out/arm64/proot android/proot-engine/src/main/jniLibs/arm64-v8a/libproot.so
        cp build/out/arm64/loader android/proot-engine/src/main/jniLibs/arm64-v8a/libproot-loader.so

    - name: Run Android App Unit Tests
      run: |
        cd android
        ./gradlew :app:testDebugUnitTest

    - name: Run session-core Unit Tests
      run: |
        cd android
        ./gradlew :session-core:testDebugUnitTest

    - name: Build Android App & proot-engine AAR
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload proot-engine AAR
      uses: actions/upload-artifact@v7
      with:
        name: proot-engine
        path: android/proot-engine/build/outputs/aar/proot-engine-debug.aar
