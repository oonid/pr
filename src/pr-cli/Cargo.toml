[package]
name = "pr-cli"
version = "0.1.0"
edition = "2021"
description = "proot-distro replacement for Android (id.or.oo.pr)"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "socks", "stream", "json"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
tar = "0.4"
xz2 = "0.1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
